[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "you-terminal-player"
version = "0.1.0"
description = "Play YouTube videos directly in your terminal, with live sound."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Peter"}
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "first-grok-build[art] @ file:///Users/peter/Developer/first-grok-build",
]

[project.scripts]
yt = "youtube_terminal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_terminal"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
