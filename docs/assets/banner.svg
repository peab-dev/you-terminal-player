<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="you-terminal-player">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
  </defs>

  <!-- light card -->
  <rect x="6" y="6" width="888" height="228" rx="16" fill="url(#bg)" stroke="#e6e8eb" stroke-width="2"/>

  <!-- title bar dots -->
  <circle cx="40" cy="38" r="6.5" fill="#ec6a5e"/>
  <circle cx="62" cy="38" r="6.5" fill="#f4bf4f"/>
  <circle cx="84" cy="38" r="6.5" fill="#61c454"/>
  <text x="112" y="43" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#9aa1a9">~/you-terminal-player — yt</text>

  <!-- soft red play button -->
  <rect x="54" y="96" width="92" height="66" rx="15" fill="#d64545"/>
  <path d="M88 114 L120 129 L88 144 Z" fill="#ffffff"/>

  <!-- title + tagline -->
  <text x="170" y="126" font-family="ui-monospace,Menlo,monospace" font-weight="700" font-size="38" fill="#1f2328">you-terminal-player</text>
  <text x="172" y="158" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#57606a">watch YouTube in your terminal · with live sound</text>

  <!-- muted half-block strip -->
  <text x="172" y="200" font-family="ui-monospace,Menlo,monospace" font-size="20" letter-spacing="1">
    <tspan fill="#d98a86">▀▀▀</tspan><tspan fill="#e0b07e">▀▀</tspan><tspan fill="#d9cf86">▀▀</tspan><tspan fill="#8fc59a">▀▀▀</tspan><tspan fill="#86bcd9">▀▀</tspan><tspan fill="#9aa9d9">▀▀</tspan><tspan fill="#b69ad1">▀▀▀</tspan>
  </text>

  <!-- thin accent underline -->
  <rect x="172" y="214" width="430" height="2" rx="1" fill="#d64545" opacity="0.6"/>
</svg>
